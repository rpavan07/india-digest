name: Daily digest

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 06:30 IST (GitHub may start it up to ~30 min late)
  workflow_dispatch: {}   # "Run workflow" button for a manual refresh

permissions:
  contents: write   # commit history.json back so the 30-day bias average persists
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build digest
        env:
          TZ: Asia/Kolkata
        run: python digest.py --out output/index.html

      - name: Save bias history
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add output/history.json
          git diff --cached --quiet || git commit -m "history: $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - id: deploy
        uses: actions/deploy-pages@v4
